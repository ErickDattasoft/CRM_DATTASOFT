name: Respuestas de clientes a tickets por correo

# Cloudflare Pages no soporta Cron Triggers (eso es solo para Workers "planos") — este workflow
# es el reloj real: llama cada 5 minutos a /correo-entrante-ticket, que revisa la bandeja de Gmail
# de soporte buscando respuestas nuevas de clientes y las copia al ticket correspondiente.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /correo-entrante-ticket
        run: |
          curl -sf -X POST "https://crm-dattasoft.pages.dev/correo-entrante-ticket?key=${{ secrets.CRON_RESPUESTAS_SECRET }}"
